<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>しずくキャッチゲーム</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #cceeff;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(204, 238, 255, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 56px;
      color: #0077cc;
      text-shadow: 2px 2px #aaddff;
      animation: float 2s ease-in-out infinite;
    }
    .overlay button {
      font-size: 24px;
      padding: 10px 30px;
      margin: 10px;
      border: none;
      background: #3399ff;
      color: white;
      border-radius: 10px;
    }
    #highScore {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 20px;
      color: #003366;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="titleScreen" class="overlay">
  <h1>💧しずくキャッチゲーム💧</h1>
  <button onclick="startGame()">スタート</button>
</div>

<div id="gameOverScreen" class="overlay" style="display:none;">
  <h1>ゲームオーバー！</h1>
  <button onclick="restartGame()">リトライ</button>
</div>

<div id="highScore">ハイスコア: 0</div>
<audio id="catchSound" src="https://freesound.org/data/previews/341/341695_5260877-lq.mp3"></audio>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const bucket = {
    x: canvas.width / 2 - 40,
    y: canvas.height - 60,
    width: 80,
    height: 40,
    speed: 10
  };

  let drops = [];
  let score = 0;
  let missed = 0;
  const maxMisses = 5;
  let gameRunning = false;

  const titleScreen = document.getElementById("titleScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const highScoreDisplay = document.getElementById("highScore");
  const catchSound = document.getElementById("catchSound");

  let highScore = localStorage.getItem("highScore") || 0;
  highScoreDisplay.textContent = "ハイスコア: " + highScore;

  function createDrop() {
    if (gameRunning && missed < maxMisses) {
      drops.push({
        x: Math.random() * canvas.width,
        y: -20,
        radius: 10,
        speed: 4 + Math.random() * 3
      });
    }
  }

  function drawBucket() {
    ctx.fillStyle = "#6666ff";
    ctx.fillRect(bucket.x, bucket.y, bucket.width, bucket.height);
  }

  function drawDrop(drop) {
    ctx.beginPath();
    ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#00ccff";
    ctx.fill();
    ctx.closePath();
  }

  function update() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBucket();

    drops.forEach((drop, index) => {
      drop.y += drop.speed;
      drawDrop(drop);

      if (
        drop.y + drop.radius > bucket.y &&
        drop.x > bucket.x &&
        drop.x < bucket.x + bucket.width
      ) {
        drops.splice(index, 1);
        score++;
        catchSound.currentTime = 0;
        catchSound.play();
      } else if (drop.y > canvas.height) {
        drops.splice(index, 1);
        missed++;
        if (missed >= maxMisses) {
          endGame();
        }
      }
    });

    ctx.fillStyle = "#003366";
    ctx.font = "24px sans-serif";
    ctx.fillText("スコア: " + score, 20, 30);
    ctx.fillText("ミス: " + missed + " / " + maxMisses, 20, 60);

    requestAnimationFrame(update);
  }

  function startGame() {
    titleScreen.style.display = "none";
    gameOverScreen.style.display = "none";
    score = 0;
    missed = 0;
    drops = [];
    gameRunning = true;
    update();
  }

  function endGame() {
    gameRunning = false;
    if (score > highScore) {
      localStorage.setItem("highScore", score);
      highScore = score;
      highScoreDisplay.textContent = "ハイスコア: " + highScore;
    }
    gameOverScreen.style.display = "flex";
  }

  function restartGame() {
    startGame();
  }

  setInterval(createDrop, 800);

  window.addEventListener("deviceorientation", (e) => {
    if (e.gamma !== null && gameRunning) {
      bucket.x += e.gamma;
      if (bucket.x < 0) bucket.x = 0;
      if (bucket.x + bucket.width > canvas.width)
        bucket.x = canvas.width - bucket.width;
    }
  });
</script>
</body>
</html>
